<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AYRA GLOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F72585'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
    <header class="site-header" id="site-header"></header>
    <main>
<section class="page-hero"><div class="container"><h1>Contact Us</h1><p>We would love to hear from you.</p></div></section>
<section class="section"><div class="container contact-grid">
<div class="card"><h2>Business Information</h2><br>
<div class="info-row"><b>Business Address</b><span class="placeholder">KABACAN COTABATO</span></div>
<div class="info-row"><b>Contact Number</b><span class="placeholder">09123456789</span></div>
<div class="info-row"><b>Email Address</b><span class="placeholder">ayraglow@gmail.com</span></div>
<div class="info-row"><b>Facebook Page</b><span class="placeholder">AYRA GLOW</span></div>
<div class="info-row"><b>Instagram Account</b><span class="placeholder">@AYRA_GLOW</span></div>
<div class="info-row"><b>Operating Hours</b><span class="placeholder">8:00AM - 8:00PM/span></div></div>
<div class="card"><h2>Send Us a Message</h2><br>
<p class="msg" id="form-msg" role="status" aria-live="polite"></p>
<form id="contact-form" novalidate>
<div class="form-group"><label for="name">Full Name *</label><input type="text" id="name" autocomplete="name" required><p class="err-text" id="name-err"></p></div>
<div class="form-group"><label for="email">Email Address *</label><input type="email" id="email" autocomplete="email" required><p class="err-text" id="email-err"></p></div>
<div class="form-group"><label for="subject">Subject *</label><input type="text" id="subject" required><p class="err-text" id="subject-err"></p></div>
<div class="form-group"><label for="message">Message *</label><textarea id="message" required></textarea><p class="err-text" id="message-err"></p></div>
<button class="btn btn-primary" type="submit">Submit</button></form></div>
</div></section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
